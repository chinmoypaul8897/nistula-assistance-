name: CI

on: push

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 22 exercises the engines floor; 24 matches the dev machine
        node-version: [22, 24]
    services:
      # CH-01: DB integration tests run against a real Postgres
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nistula
          POSTGRES_PASSWORD: nistula
          POSTGRES_DB: nistula_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nistula"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://nistula:nistula@localhost:5432/nistula_test
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from package.json "packageManager"
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The gate: typecheck + lint + tests (plan §3.1)
      - run: pnpm check

      # Dependency audit (plan §3.3)
      - run: pnpm audit --audit-level high

      # Fixture PII guard (plan §3.6). Two patterns: the +91 form AND the
      # plusless wire form Meta actually sends — only the reserved test range
      # (9177009xxxxx) is allowed. The precise per-digit-run check lives in
      # test/fixture-scrub.test.ts; this grep is the CI backstop.
      #
      # SCOPE: the two DATA-bearing dirs — test/fixtures/ (recorded payloads) and
      # test/acceptance/ (CH-19's seeded guests/bookings), which a review found was
      # outside the guard entirely. Deliberately NOT all of test/: the phone,
      # scrubber and logger-redaction unit tests legitimately carry synthetic
      # 91-shaped numbers as their INPUT, and would fire ~30 false positives.
      - name: Fixture PII guard
        run: |
          if grep -rEn '\+91[0-9]{5,}' test/fixtures/ test/acceptance/ | grep -vE '9177009[0-9]{5}'; then
            echo '::error::Real-looking +91 number found in test/fixtures or test/acceptance'
            exit 1
          fi
          if grep -rEn '91[0-9]{10}' test/fixtures/ test/acceptance/ | grep -vE '9177009[0-9]{5}'; then
            echo '::error::Real-looking plusless 91 number found in test/fixtures or test/acceptance'
            exit 1
          fi
